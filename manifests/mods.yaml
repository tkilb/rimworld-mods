# RimWorld Monorepo - Mod Manifest Specification
# Declares 3rd-party community mods, sources, and desired versions/pins.
# Synchronized to reflect active mods from Steam Deck (ModsConfig-on-deck.xml).
version: 1

# Official Expansion (DLC) Toggles
# Set to false to omit from ModsConfig.xml and disable in RimWorld.
dlcs:
  royalty: true
  ideology: true
  biotech: true
  anomaly: false
  odyssey: true

