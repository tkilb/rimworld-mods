# RimWorld Monorepo - Mod Manifest Specification
# Declares 3rd-party community mods, sources, and desired versions/pins.
# Synchronized to reflect active mods from Steam Deck (ModsConfig-on-deck.xml).
version: 1

# Official Expansion (DLC) Toggles
# Set to false to omit from ModsConfig.xml and disable in RimWorld.
dlcs:
  royalty: false
  ideology: false
  biotech: true
  anomaly: false
  odyssey: false

mods:
  vanillabionicsexpansion:
    name: "[FSF] Vanilla Bionics Expansion"
    source: steam_workshop
    workshop_id: "1419675146"
    package_id: "FrozenSnowFox.VanillaBionicsExpansion"
    enabled: true
    description: "Fills out the vanilla bionics to include numerous omitted body parts"

  vanillavehiclesexpanded:
    name: "Vanilla Vehicles Expanded"
    source: steam_workshop
    workshop_id: "3014906877"
    package_id: "OskarPotocki.VanillaVehiclesExpanded"
    enabled: true
    description: "Vanilla Vehicles Expanded is a long awaited mod utilising Smash Phil’s Vehicles framework. The main purpose of the mod is to add realistic and engaging mechanics surrounding vehicles of all kinds into the game. Not just the cars, but boats and airplanes too, this mod comes packed full of content and"

  simplesidearms:
    name: "Simple sidearms"
    source: steam_workshop
    workshop_id: "927155256"
    package_id: "PeteTimesSix.SimpleSidearms"
    enabled: true
    description: "With the invention of pockets comes the idea of bringing EVEN MORE WEAPONS. Because your snipers are getting really tired of getting shanked.  See forum thread for details. https://ludeon.com/forums/index.php?topic=32497.0"

  dubspaintshop:
    name: "Dub's Paint Shop"
    source: steam_workshop
    workshop_id: "1579516669"
    package_id: "Dubwise.DubsPaintShop"
    enabled: true
    description: "Adds painting tools to change the colour of stuffed or colourable buildings, apparel, and terrain\n\nMultiplayer Ready"

  vehicleframework:
    name: "Vehicle Framework"
    source: steam_workshop
    workshop_id: "3014915404"
    package_id: "SmashPhil.VehicleFramework"
    enabled: true
    description: "Framework which allows the creation of vehicles in RimWorld."

  vanillafactionsexpandedcore:
    name: "Vanilla Expanded Framework"
    source: steam_workshop
    workshop_id: "2023507013"
    package_id: "OskarPotocki.VanillaFactionsExpanded.Core"
    enabled: true
    description: "Vanilla Expanded Framework incorporates a multitude of functionalities for different mods in order for us to boost performance by not duplicating code across several mods. Examples of shared functionality include custom base generation code with an amazing building export tool, customisable sieges, "
  harmony:
    name: "Harmony"
    source: steam_workshop
    workshop_id: "2009463077"
    package_id: "brrainz.harmony"
    enabled: true
    description: "A library for patching, replacing and decorating .NET and Mono methods during runtime."

  laboratory:
    name: "ilyvion's Laboratory"
    source: steam_workshop
    workshop_id: "3296362231"
    package_id: "ilyvion.laboratory"
    enabled: true
    description: "Library and framework mod providing shared utilities for ilyvion mods."

  colonymanagerredux:
    name: "Colony Manager Redux"
    source: steam_workshop
    workshop_id: "3310027356"
    package_id: "ilyvion.colonymanagerredux"
    enabled: true
    description: "Automate tedious managerial tasks such as hunting, forestry, and livestock management."

  recyclethis:
    name: "Recycle This (Continued)"
    source: steam_workshop
    workshop_id: "3253550009"
    package_id: "Mlie.RecycleThis"
    enabled: true
    description: "Recycle or destroy unwanted weapons and apparel directly via order commands."

  generipper:
    name: "Gene Ripper"
    source: steam_workshop
    workshop_id: "3524806362"
    package_id: "Defi.GeneRipper"
    enabled: true
    description: "Lethally extract specific desired genes from pawns with guaranteed success."

  genebankplus:
    name: "Gene Bank Plus"
    source: steam_workshop
    workshop_id: "2889919154"
    package_id: "lowli.genebankplus"
    enabled: true
    description: "Expanded gene banks with higher genepack storage capacities."

  minifyeverything:
    name: "MinifyEverything"
    source: steam_workshop
    workshop_id: "872762753"
    package_id: "erdelf.MinifyEverything"
    enabled: true
    description: "Allows minifying and reinstalling nearly all buildings and furniture."

  # Custom Authoring Mods
  gene-splicer:
    name: "Gene Splicer"
    source: custom
    package_id: "tyler.genesplicer"
    enabled: false
    description: "Vanilla-adjacent germline genetic engineering for natural human embryos."

  organic-constructs:
    name: "Organic Constructs"
    source: custom
    package_id: "tyler.organicconstructs"
    enabled: true
    description: "Manufacture 100% biological artificial humans from living tissue."

